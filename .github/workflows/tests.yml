name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Run isolated and loopback tests
        run: npm test
      - name: Audit locked production dependencies
        run: npm audit --package-lock-only --omit=dev
